<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    /* Markit 编辑风 · 扩展版（双主题跟随系统） */
    :root {
      --accent: #2e5be6; --accent-h: #2549c4;
      --bg: #fafaf8; --card: #ffffff; --subtle: #f2f2ef;
      --line: #e8e6e1; --text: #1a1a17; --text2: #55554f; --muted: #a9a9a1;
      --ok-bg: #e9f5ec; --ok: #1e7b34;
      --err-bg: #fcebea; --err: #c23830;
      --load-bg: #f2f2ef; --load: #83837c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --accent: #3d6bf0; --accent-h: #5a85f5;
        --bg: #141412; --card: #1d1d1a; --subtle: #262622;
        --line: #2e2d28; --text: #f0efea; --text2: #a8a79f; --muted: #5c5b54;
        --ok-bg: #17301e; --ok: #6fcf8e;
        --err-bg: #3a1d1a; --err: #f08c84;
        --load-bg: #262622; --load: #7c7b73;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 340px;
      max-height: 560px; /* Chrome 弹窗超限会截断，限高+内容区滚动保证完整展示 */
      display: flex;
      flex-direction: column;
      font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
      font-size: 13px; line-height: 1.5;
      color: var(--text); background: var(--bg);
    }
    .body-scroll {
      flex: 1; min-height: 0;
      overflow-y: auto;
      padding: 14px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .head {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
    }
    .head img { width: 20px; height: 20px; border-radius: 5px; }
    .head .name { font-weight: 600; font-size: 14px; letter-spacing: -0.01em; }
    .head .open {
      margin-left: auto; font-size: 12px; color: var(--text2);
      text-decoration: none; padding: 2px 6px; border-radius: 999px;
    }
    .head .open:hover { background: var(--subtle); color: var(--text); }
    .gear {
      margin-left: auto;
      border: none; background: none; cursor: pointer;
      font-size: 14px; color: var(--muted);
      padding: 2px 6px; border-radius: 6px;
    }
    .gear:hover { background: var(--subtle); color: var(--text); }
    .head .open { margin-left: 0; }
    .btn.ghost { width: 100%; border: 1px dashed var(--line); border-radius: 8px; }
    .body { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
    .status {
      display: flex; align-items: center; gap: 7px;
      padding: 8px 12px; border-radius: 999px; font-size: 12px; font-weight: 500;
    }
    .status.ok { background: var(--ok-bg); color: var(--ok); }
    .status.err { background: var(--err-bg); color: var(--err); }
    .status.loading { background: var(--load-bg); color: var(--load); }
    label { display: block; font-size: 12px; font-weight: 500; color: var(--text2); margin-bottom: 5px; }
    .label-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; }
    .label-row label { margin-bottom: 0; }
    .mini {
      border: none; background: none; font-size: 11px; color: var(--accent);
      cursor: pointer; padding: 2px 4px; border-radius: 6px;
    }
    .mini:hover { background: var(--subtle); }
    input, textarea, select {
      width: 100%; border: 1px solid var(--line); border-radius: 8px;
      padding: 8px 10px; font: inherit; font-size: 13px;
      background: var(--card); color: var(--text);
      transition: border-color 0.15s;
    }
    input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
    input.err { border-color: var(--err); }
    input::placeholder, textarea::placeholder { color: var(--muted); }
    textarea { resize: vertical; min-height: 52px; }
    .url-row { font-size: 11px; color: var(--muted); word-break: break-all; }
    .btn {
      border: none; border-radius: 999px; padding: 9px 18px;
      font-size: 13px; font-weight: 500; cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .btn:active { transform: scale(0.98); }
    .btn.primary { background: var(--accent); color: #fff; }
    .btn.primary:hover { background: var(--accent-h); }
    .btn.primary:disabled { opacity: 0.5; cursor: default; }
    .btn.ghost { background: none; color: var(--text2); padding: 9px 10px; }
    .btn.ghost:hover { color: var(--text); background: var(--subtle); }
    .row-end { display: flex; justify-content: flex-end; gap: 8px; }
    .hint { font-size: 11px; color: var(--muted); line-height: 1.7; }
    .steps { padding-left: 16px; font-size: 12px; color: var(--text2); line-height: 2; }
    .divider { height: 1px; background: var(--line); margin: 2px 0; }
    .spin { animation: spin 0.9s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="head">
    <img src="icons/icon48.png" alt="" />
    <span class="name">Markit</span>
    <a class="open" id="openSite" href="#" target="_blank" style="display:none">打开站点 ↗</a>
  </div>
  <div id="app" class="body-scroll"></div>
  <script src="popup.js"></script>
</body>
</html>
